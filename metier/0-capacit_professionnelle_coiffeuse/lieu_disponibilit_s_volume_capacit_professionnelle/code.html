<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Atelier Synergy - Capacité professionnelle</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "inverse-primary": "#c7c6c6",

                            "on-secondary": "#ffffff",

                            "error-container": "#ffdad6",
                            "on-primary": "#ffffff",
                            "secondary": "#775a19",
                            "primary": "#000101",
                            "tertiary-container": "#271900",
                            "tertiary": "#000000",
                            "surface": "#fcf8f8",
                            "on-background": "#1c1b1b",
                            "surface-container": "#f1edec",
                            "on-tertiary-container": "#a17f3c",
                            "on-secondary-container": "#785a19",
                            "on-error": "#ffffff",
                            "surface-variant": "#e5e2e1",
                            "on-surface": "#1c1b1b",
                            "surface-tint": "#5e5e5e",
                            "secondary-fixed-dim": "#e8c176",
                            "surface-container-low": "#f7f3f2",
                            "primary-fixed": "#e3e2e2",
                            "on-secondary-fixed-variant": "#5c4200",
                            "surface-dim": "#ddd9d8",
                            "surface-container-lowest": "#ffffff",
                            "on-tertiary": "#ffffff",
                            "on-surface-variant": "#444748",
                            "surface-container-high": "#ebe7e7",
                            "tertiary-fixed": "#ffdea6",
                            "inverse-surface": "#313030",
                            "outline": "#747878",
                            "on-tertiary-fixed": "#271900",
                            "surface-bright": "#fcf8f8",
                            "primary-fixed-dim": "#c7c6c6",
                            "inverse-on-surface": "#f4f0ef",
                            "tertiary-fixed-dim": "#e9c177",
                            "on-primary-container": "#848484",
                            "on-primary-fixed": "#1b1c1c",
                            "background": "#fcf8f8",
                            "surface-container-highest": "#e5e2e1",
                            "primary-container": "#1b1c1c",
                            "secondary-container": "#fdd587",
                            "on-tertiary-fixed-variant": "#5d4201",

                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",

                    "spacing": {

                    },
                    "fontFamily": {
                            "display-lg": ["manrope"],
                            "display-lg-mobile": ["manrope"],

                            "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]

                }
            }
        }

<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom radio styling for context cards */
        input[type="radio"]:checked + div {
            border-color: #1b1c1c;
            background-color: #ffffff;
        }
        input[type="radio"]:checked + div .radio-icon {
            color: #1b1c1c;
        }
        /* Custom checkbox for days */
        input[type="checkbox"]:checked + div {
            background-color: #1b1c1c;
            color: #ffffff;
            border-color: #1b1c1c;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased pb-32">
<!-- TopAppBar from JSON -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary-fixed font-headline-sm text-headline-sm sticky top-0 w-full border-b border-outline-variant dark:border-outline z-50">
<div class="flex items-center px-container-margin h-16 w-full max-w-screen-xl mx-auto">
<button class="active:scale-95 transition-transform hover:bg-surface-container dark:hover:bg-surface-container-high rounded-full p-2 -ml-2 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-4 font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed">Capacité professionnelle</h1>
<div class="ml-auto">
<span class="font-label-technical text-label-technical bg-secondary-fixed text-on-secondary-fixed-variant px-2 py-1 rounded-sm uppercase">Brouillon</span>
</div>
</div>
</header>
<main class="px-container-margin py-lg max-w-md mx-auto">
<!-- Stepper -->
<div class="flex items-center justify-between mb-lg">
<div class="flex gap-2">
<div class="w-8 h-1 rounded-full bg-primary-fixed"></div>
<div class="w-8 h-1 rounded-full bg-primary-fixed"></div>
<div class="w-8 h-1 rounded-full bg-primary-fixed"></div>
<div class="w-8 h-1 rounded-full bg-primary-fixed"></div>
<div class="w-8 h-1 rounded-full bg-primary"></div>
</div>
<span class="font-label-technical text-label-technical text-on-surface-variant">Étape 5/5</span>
</div>
<!-- Page Header -->
<section class="mb-xl">
<h2 class="font-display-lg-mobile text-display-lg-mobile mb-sm">Lieu, disponibilités &amp; volume</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Indiquez où et quand cette prestation est réalisable, et combien de demandes vous souhaitez.</p>
</section>
<!-- Location Section -->
<section class="mb-xl">
<h3 class="font-headline-sm text-headline-sm mb-md">Contexte d'exécution</h3>
<div class="grid gap-md">
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="location" type="radio" value="home"/>
<div class="border border-outline-variant rounded-lg p-md bg-surface-container-lowest transition-colors flex items-start gap-md">
<span class="material-symbols-outlined text-outline radio-icon mt-0.5" data-icon="home">home</span>
<div>
<span class="block font-headline-sm text-headline-sm mb-xs">Chez moi</span>
<span class="block font-body-md text-body-md text-on-surface-variant">Espace personnel / studio à domicile</span>
</div>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="location" type="radio" value="salon"/>
<div class="border border-outline-variant rounded-lg p-md bg-surface-container-lowest transition-colors flex items-start gap-md">
<span class="material-symbols-outlined text-outline radio-icon mt-0.5" data-icon="storefront">storefront</span>
<div>
<span class="block font-headline-sm text-headline-sm mb-xs">En salon</span>
<span class="block font-body-md text-body-md text-on-surface-variant">Espace professionnel partenaire</span>
</div>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="location" type="radio" value="travel"/>
<div class="border border-outline-variant rounded-lg p-md bg-surface-container-lowest transition-colors flex items-start gap-md">
<span class="material-symbols-outlined text-outline radio-icon mt-0.5" data-icon="directions_car">directions_car</span>
<div>
<span class="block font-headline-sm text-headline-sm mb-xs">Déplacement</span>
<span class="block font-body-md text-body-md text-on-surface-variant">Je me rends chez la cliente</span>
</div>
</div>
</label>
</div>
</section>
<!-- Availability Section -->
<section class="mb-xl">
<h3 class="font-headline-sm text-headline-sm mb-md">Disponibilités</h3>
<div class="mb-md">
<span class="block font-label-caps text-label-caps text-on-surface-variant mb-sm">JOURS</span>
<div class="flex gap-sm overflow-x-auto no-scrollbar pb-xs">
<label class="cursor-pointer shrink-0">
<input class="peer sr-only" name="day" type="checkbox" value="lun"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-caps text-label-caps text-on-surface transition-colors bg-surface-container-lowest">LUN</div>
</label>
<label class="cursor-pointer shrink-0">
<input checked="" class="peer sr-only" name="day" type="checkbox" value="mar"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-caps text-label-caps text-on-surface transition-colors bg-surface-container-lowest">MAR</div>
</label>
<label class="cursor-pointer shrink-0">
<input checked="" class="peer sr-only" name="day" type="checkbox" value="mer"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-caps text-label-caps text-on-surface transition-colors bg-surface-container-lowest">MER</div>
</label>
<label class="cursor-pointer shrink-0">
<input checked="" class="peer sr-only" name="day" type="checkbox" value="jeu"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-caps text-label-caps text-on-surface transition-colors bg-surface-container-lowest">JEU</div>
</label>
<label class="cursor-pointer shrink-0">
<input checked="" class="peer sr-only" name="day" type="checkbox" value="ven"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-caps text-label-caps text-on-surface transition-colors bg-surface-container-lowest">VEN</div>
</label>
<label class="cursor-pointer shrink-0">
<input checked="" class="peer sr-only" name="day" type="checkbox" value="sam"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-caps text-label-caps text-on-surface transition-colors bg-surface-container-lowest">SAM</div>
</label>
<label class="cursor-pointer shrink-0">
<input class="peer sr-only" name="day" type="checkbox" value="dim"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-caps text-label-caps text-on-surface transition-colors bg-surface-container-lowest">DIM</div>
</label>
</div>
</div>
<div>
<span class="block font-label-caps text-label-caps text-on-surface-variant mb-sm">CRÉNEAUX</span>
<div class="flex flex-wrap gap-sm">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="slot" type="checkbox" value="morning"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-technical text-label-technical text-on-surface transition-colors bg-surface-container-lowest">09:00 - 13:00</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="slot" type="checkbox" value="afternoon"/>
<div class="px-md py-sm border border-outline-variant rounded-full font-label-technical text-label-technical text-on-surface transition-colors bg-surface-container-lowest">14:00 - 18:00</div>
</label>
</div>
</div>
</section>
<!-- Volume Section -->
<section class="mb-xl">
<h3 class="font-headline-sm text-headline-sm mb-md">Volume</h3>
<div class="grid gap-md">
<div>
<label class="block font-body-md text-body-md text-on-surface mb-xs" for="capacity">Capacité max (RDV / jour)</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-label-technical text-label-technical focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" id="capacity" name="capacity" type="number" value="3"/>
</div>
<div>
<label class="block font-body-md text-body-md text-on-surface mb-xs" for="volume">Volume de demandes souhaité</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-label-technical text-label-technical focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" id="volume" name="volume" type="number" value="15"/>
</div>
</div>
</section>
</main>
<!-- Sticky CTA -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-md z-40 pb-safe">
<button class="w-full bg-primary text-on-primary font-body-md text-body-md py-sm px-md rounded-lg flex items-center justify-center gap-sm active:scale-95 transition-transform">
            Voir le récapitulatif
            <span class="material-symbols-outlined text-on-primary" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Suppressed BottomNavBar as this is a linear transactional flow (Step 5/5) with a sticky CTA, not a top-level destination -->
</body></html>
