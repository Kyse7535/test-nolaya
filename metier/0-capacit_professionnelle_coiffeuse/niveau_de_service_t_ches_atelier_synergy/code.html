<script>
        // Simple JS for the mockup to toggle notes based on button clicks
        function toggleTaskNote(noteId) {
            const noteEl = document.getElementById(noteId);
            if(noteEl) {
                noteEl.classList.remove('hidden');
            }
        }
        
        // Add rudimentary toggle logic for the mockup buttons
        document.querySelectorAll('.flex.bg-surface-container-high').forEach(group => {
            const buttons = group.querySelectorAll('button:not([disabled])');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    buttons.forEach(b => {
                        b.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
                        b.classList.add('text-on-surface-variant');
                    });
                    this.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
                    this.classList.remove('text-on-surface-variant');
                    
                    // Hide note if Styliste is selected, show if Cliente
                    const container = this.closest('.bg-surface-container-low');
                    const note = container.querySelector('[id$="-note"]');
                    if(note) {
                        if(this.textContent.trim() === 'Styliste') {
                            note.classList.add('hidden');
                        } else {
                            note.classList.remove('hidden');
                        }
                    }
                });
            });
        });
    </script>
