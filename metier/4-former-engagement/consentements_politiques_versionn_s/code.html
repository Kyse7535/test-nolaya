<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Atelier Synergy - Consentements</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-surface": "#303030",
                        "tertiary": "#000000",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#e3e2e2",
                        "secondary": "#775a19",
                        "secondary-container": "#fdd587",
                        "surface-variant": "#e4e2e1",
                        "surface-dim": "#dbdad9",
                        "secondary-fixed-dim": "#e8c176",
                        "on-background": "#1b1c1b",
                        "surface-tint": "#5e5e5e",
                        "primary": "#000101",
                        "on-secondary-container": "#785a19",
                        "on-tertiary-fixed": "#271900",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#271900",
                        "on-tertiary-fixed-variant": "#5d4201",
                        "surface-container": "#efedec",
                        "surface": "#fbf9f8",
                        "surface-container-highest": "#e4e2e1",
                        "on-error": "#ffffff",
                        "primary-container": "#1b1c1c",
                        "surface-container-high": "#e9e8e7",
                        "inverse-on-surface": "#f2f0ef",
                        "on-tertiary-container": "#a17f3c",
                        "tertiary-fixed-dim": "#e9c177",
                        "on-surface-variant": "#444748",
                        "secondary-fixed": "#ffdea3",
                        "primary-fixed-dim": "#c7c6c6",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#747878",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c4c7c7",
                        "surface-container-low": "#f5f3f2",
                        "on-primary-fixed": "#1b1c1c",
                        "on-primary-container": "#848484",
                        "on-secondary-fixed-variant": "#5c4200",
                        "on-surface": "#1b1c1b",
                        "tertiary-fixed": "#ffdea6",
                        "on-primary-fixed-variant": "#464747",
                        "on-secondary-fixed": "#261900",
                        "inverse-primary": "#c7c6c6",
                        "surface-bright": "#fbf9f8",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "background": "#fbf9f8"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "container-margin": "20px",
                        "unit": "4px",
                        "gutter": "12px",
                        "section-gap": "48px",
                        "stack-lg": "32px",
                        "stack-sm": "8px"
                    },
                    fontFamily: {
                        "headline-md": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "headline-sm": ["Manrope"],
                        "display-lg": ["Manrope"],

                        "display-lg-mobile": ["Manrope"],
                        "body-sm": ["Manrope"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700" }],

                    }
                }
            }
        }

<style>
        /* Base styles */
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 1px solid theme('colors.primary-container');
            border-radius: 4px;
            display: inline-grid;
            place-content: center;
            background-color: theme('colors.surface');
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-checkbox::before {
            content: "";
            width: 12px;
            height: 12px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em theme('colors.on-primary');
            background-color: theme('colors.on-primary');
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: theme('colors.primary-container');
            border-color: theme('colors.primary-container');
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Responsive max width for mobile feel on desktop */
        .mobile-container {
            max-width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background-color: theme('colors.background');
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-low antialiased">
<div class="mobile-container flex flex-col h-screen overflow-hidden">
<!-- TopAppBar from JSON -->
<header class="bg-surface w-full sticky top-0 z-50 border-b border-surface-container flex flex-col pt-safe">
<div class="flex items-center justify-between px-container-margin h-16 w-full">
<button class="text-primary hover:bg-surface-container-low transition-colors duration-200 p-2 -ml-2 rounded-full active:opacity-70 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Consentements</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</div>
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 overflow-y-auto pb-32">
<div class="px-container-margin py-stack-lg">
<!-- Status Badge -->
<div class="inline-block px-3 py-1 mb-stack-md bg-secondary-container rounded text-on-secondary-container">
<span class="font-label-technical text-label-technical">EN ATTENTE</span>
</div>
<!-- Stepper -->
<div class="flex items-center justify-between mb-section-gap relative">
<!-- Line background -->
<div class="absolute top-1/2 left-0 w-full h-px bg-surface-container -z-10 transform -translate-y-1/2"></div>
<!-- Line progress -->
<div class="absolute top-1/2 left-0 w-1/2 h-px bg-primary-container -z-10 transform -translate-y-1/2"></div>
<!-- Step 1: Done -->
<div class="flex flex-col items-center gap-2 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center border border-primary-container">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<span class="font-label-caps text-[9px] text-primary-container">RÉCAP</span>
</div>
<!-- Step 2: Active -->
<div class="flex flex-col items-center gap-2 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center border border-secondary-container shadow-sm">
<span class="font-label-technical text-label-technical">2</span>
</div>
<span class="font-label-caps text-[9px] text-primary">ACCORD</span>
</div>
<!-- Step 3: Upcoming -->
<div class="flex flex-col items-center gap-2 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-surface border border-outline-variant text-on-surface-variant flex items-center justify-center">
<span class="font-label-technical text-label-technical">3</span>
</div>
<span class="font-label-caps text-[9px] text-on-surface-variant">PAIE</span>
</div>
</div>
<!-- Header & Intro -->
<div class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md mb-stack-sm text-primary">Consentements</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Vous acceptez la même version de l’offre et des politiques applicables.
                </p>
</div>
<!-- Offer Reference Card -->
<div class="bg-surface-container-low border border-surface-variant rounded-lg p-stack-md mb-section-gap flex items-center gap-3">
<span class="material-symbols-outlined text-outline">description</span>
<span class="font-label-technical text-label-technical text-primary-container">Offre PROP-2026-0315 · version 1</span>
</div>
<!-- Consent Sections -->
<div class="space-y-stack-md mb-section-gap">
<!-- Item A -->
<label class="flex items-start gap-gutter p-stack-md border border-surface-container rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="pt-1">
<input checked="" class="custom-checkbox" type="checkbox"/>
</div>
<div class="flex-1">
<p class="font-body-lg text-body-lg text-primary font-medium mb-1">
                            J’accepte l’offre ferme telle que présentée
                        </p>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Prestation, prix 220 €, créneau du 15 mars
                        </p>
</div>
</label>
<!-- Item B -->
<label class="flex items-start gap-gutter p-stack-md border border-surface-container rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="pt-1">
<input class="custom-checkbox" type="checkbox"/>
</div>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1 flex-wrap">
<p class="font-body-lg text-body-lg text-primary font-medium">
                                J’accepte la politique d’annulation
                            </p>
<span class="bg-surface-container px-2 py-0.5 rounded font-label-technical text-[10px] text-on-surface-variant">v1.2</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant border-l-2 border-surface-variant pl-3 py-1 mt-2 bg-surface-container-lowest">
                            Annulation &lt; 48 h : acompte non remboursable. No-show : prestation due.
                        </p>
</div>
</label>
<!-- Item C -->
<label class="flex items-start gap-gutter p-stack-md border border-surface-container rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="pt-1">
<input class="custom-checkbox" type="checkbox"/>
</div>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1 flex-wrap">
<p class="font-body-lg text-body-lg text-primary font-medium">
                                J’accepte la politique de retard
                            </p>
<span class="bg-surface-container px-2 py-0.5 rounded font-label-technical text-[10px] text-on-surface-variant">v1.0</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant border-l-2 border-surface-variant pl-3 py-1 mt-2 bg-surface-container-lowest">
                            Retard &gt; 20 min : créneau pouvant être raccourci ou reporté.
                        </p>
</div>
</label>
</div>
<!-- Footer Note -->
<p class="font-body-sm text-body-sm text-outline text-center px-4">
                Ces consentements seront horodatés localement dans la démo.
            </p>
</div>
</main>
<!-- Sticky Action Bar -->
<div class="absolute bottom-0 w-full bg-surface border-t border-surface-container p-container-margin pb-safe bg-opacity-95 backdrop-blur-sm z-40 flex flex-col gap-stack-sm">
<button class="w-full bg-primary-container text-on-primary font-body-lg text-body-lg py-3 rounded-lg flex justify-center items-center gap-2 active:scale-95 transition-transform">
            Continuer vers le paiement
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full bg-surface text-primary border border-primary-container font-body-lg text-body-lg py-3 rounded-lg flex justify-center items-center active:scale-95 transition-transform">
            Revenir
        </button>
</div>
</div>
</body></html>
