<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nolaya - Zone &amp; mobilité</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#efedec",
                        "on-secondary-container": "#785a19",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#444748",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#ffdea3",
                        "primary-container": "#1b1c1c",
                        "primary-fixed": "#e3e2e2",
                        "surface-variant": "#e4e2e1",
                        "inverse-on-surface": "#f2f0ef",
                        "outline": "#747878",
                        "on-secondary-fixed": "#261900",
                        "inverse-surface": "#303030",
                        "surface-bright": "#fbf9f8",
                        "on-tertiary-container": "#a17f3c",
                        "tertiary-fixed-dim": "#e9c177",
                        "surface-container-highest": "#e4e2e1",
                        "primary": "#000101",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f5f3f2",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c4c7c7",
                        "on-surface": "#1b1c1b",
                        "on-primary-fixed-variant": "#464747",
                        "surface": "#fbf9f8",
                        "on-error": "#ffffff",
                        "secondary": "#775a19",
                        "on-tertiary-fixed": "#271900",
                        "on-background": "#1b1c1b",
                        "secondary-container": "#fdd587",
                        "tertiary-fixed": "#ffdea6",
                        "surface-container-high": "#e9e8e7",
                        "surface-dim": "#dbdad9",
                        "inverse-primary": "#c7c6c6",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#e8c176",
                        "background": "#fbf9f8",
                        "surface-tint": "#5e5e5e",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#1b1c1c",
                        "tertiary": "#000000",
                        "on-primary-container": "#848484",
                        "tertiary-container": "#271900",
                        "on-tertiary-fixed-variant": "#5d4201",
                        "primary-fixed-dim": "#c7c6c6",
                        "on-secondary-fixed-variant": "#5c4200",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "section-gap": "48px",
                        "stack-lg": "32px",
                        "unit": "4px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],
                        "headline-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "label-sm": ["JetBrains Mono"],
                        "body-sm": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "body-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen pb-24 font-body-sm text-body-sm">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background border-b border-surface-container-highest dark:border-outline-variant flat no shadows flex items-center justify-between px-container-margin h-16 w-full">
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity Active: scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-primary dark:text-primary-fixed-dim flex-1 text-center font-bold tracking-tight">Qualification</h1>
<div class="px-2 py-1 bg-secondary-container text-on-secondary-container text-label-caps font-label-caps rounded-DEFAULT">
            BROUILLON
        </div>
</header>
<main class="pt-24 px-container-margin pb-stack-lg flex flex-col gap-section-gap">
<!-- Header & Stepper -->
<section class="flex flex-col gap-stack-md">
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-primary">Zone &amp; mobilité</h2>
<!-- Stepper -->
<div class="flex items-center gap-2">
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"><div class="h-full bg-primary rounded-full w-full"></div></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"><div class="h-full bg-primary rounded-full w-full"></div></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"><div class="h-full bg-primary rounded-full w-full"></div></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"><div class="h-full bg-secondary-container rounded-full w-full"></div></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<p class="text-on-surface-variant font-body-sm text-body-sm">
                Indiquez où la prestation peut avoir lieu. L’adresse exacte viendra plus tard.
            </p>
</section>
<!-- Zone Prefill -->
<section class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase">Zone</label>
<div class="flex items-center gap-3 p-4 bg-surface-container-lowest border border-surface-container-highest rounded-lg">
<span class="material-symbols-outlined text-outline" data-icon="location_on">location_on</span>
<span class="text-primary font-body-lg text-body-lg">Paris 18e / nord de Paris</span>
</div>
</section>
<!-- Rayon de recherche -->
<section class="flex flex-col gap-stack-sm overflow-hidden">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase">Rayon de recherche</label>
<div class="flex gap-3 overflow-x-auto hide-scrollbar py-1">
<button class="px-4 py-2 border border-surface-container-highest rounded-full text-label-caps font-label-caps text-on-surface-variant whitespace-nowrap">5 km</button>
<button class="px-4 py-2 border border-surface-container-highest rounded-full text-label-caps font-label-caps text-on-surface-variant whitespace-nowrap">10 km</button>
<button class="px-4 py-2 bg-primary text-on-primary rounded-full text-label-caps font-label-caps whitespace-nowrap">15 km</button>
<button class="px-4 py-2 border border-surface-container-highest rounded-full text-label-caps font-label-caps text-on-surface-variant whitespace-nowrap">25 km</button>
</div>
</section>
<!-- Qui se déplace -->
<section class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase">Qui se déplace ?</label>
<div class="flex flex-col gap-3">
<label class="flex items-start gap-4 p-4 border border-surface-container-highest rounded-lg bg-surface-container-lowest cursor-pointer">
<input class="mt-1 text-primary focus:ring-primary h-4 w-4 border-outline-variant" name="mobility" type="radio"/>
<span class="font-body-lg text-body-lg text-primary">Je me déplace chez la coiffeuse</span>
</label>
<label class="flex items-start gap-4 p-4 border border-surface-container-highest rounded-lg bg-surface-container-lowest cursor-pointer">
<input class="mt-1 text-primary focus:ring-primary h-4 w-4 border-outline-variant" name="mobility" type="radio"/>
<span class="font-body-lg text-body-lg text-primary">La coiffeuse vient chez moi</span>
</label>
<label class="flex items-start gap-4 p-4 border border-primary rounded-lg bg-surface-container-lowest cursor-pointer">
<input checked="" class="mt-1 text-primary focus:ring-primary h-4 w-4 border-outline-variant" name="mobility" type="radio"/>
<span class="font-body-lg text-body-lg text-primary font-medium">Les deux me conviennent</span>
</label>
</div>
</section>
<!-- Lieux acceptés -->
<section class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase">Lieux acceptés</label>
<p class="text-label-sm font-label-sm text-outline">Choisissez au moins un lieu accepté.</p>
<div class="flex flex-col gap-3 mt-2">
<label class="flex items-center justify-between p-4 border border-surface-container-highest rounded-lg bg-surface-container-lowest cursor-pointer">
<span class="font-body-lg text-body-lg text-primary">Chez moi</span>
<input checked="" class="text-primary focus:ring-primary h-5 w-5 border-outline-variant rounded" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 border border-surface-container-highest rounded-lg bg-surface-container-lowest cursor-pointer">
<span class="font-body-lg text-body-lg text-primary">Chez la coiffeuse / studio</span>
<input checked="" class="text-primary focus:ring-primary h-5 w-5 border-outline-variant rounded" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-4 border border-surface-container-highest rounded-lg bg-surface-container-lowest cursor-pointer">
<span class="font-body-lg text-body-lg text-primary">En salon</span>
<input class="text-primary focus:ring-primary h-5 w-5 border-outline-variant rounded" type="checkbox"/>
</label>
</div>
</section>
<p class="text-label-sm font-label-sm text-outline text-center pb-8">
            Pas de matching ici — seulement le cadre géographique de votre demande.
        </p>
</main>
<!-- Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-surface-container-highest p-4 z-40">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-headline-md text-body-lg font-medium hover:opacity-90 transition-opacity">
            Continuer
        </button>
</div>
</body></html>
