<!DOCTYPE html>

<html class="light" lang="fr"><head>

                    },
                    "fontFamily": {

<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative pb-[120px]">
<!-- TopAppBar (Transactional / Dead End - No nav shell expected, but user requested TopAppBar for minimal branding) -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-surface-container flat no shadows flex flex-col justify-center px-container-margin h-16 w-full">
<div class="flex items-center justify-between w-full">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight text-center flex-1">Atelier Synergy</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="flex-grow pt-16 flex flex-col">
<!-- Hero Section -->
<section class="w-full relative aspect-[3/4] md:aspect-[16/9] lg:aspect-[21/9] overflow-hidden">
<img alt="Succès de la demande" class="w-full h-full object-cover rounded-none" data-alt="A premium, editorial-style photograph of a beautiful Black woman with stunning, perfectly styled textured Afro hair. She is smiling confidently, exuding a sense of joy and high-end luxury. The lighting is soft and flattering, highlighting the rich textures of her hair and the warmth of her skin. The background is a slightly blurred, minimalist modern interior with soft off-white and charcoal tones, complementing the elegant mood." src="https://lh3.googleusercontent.com/aida/AP1WRLuUss6DK_n3JdwQ1tkGMyU5vN7he_v2xnPSVHAaQgzOXWMcH3KxHsU02MXsvESzyyeMG_Tv0kZVLOshaFZdNAdrm3KV1Tu0gaeTmx0JVpG3e4pKSUr48s5vrgV4GNwYTpnJmHLZmY0hGwrEpwrwnsmDAA9a8Rd8hbEZhS_2sPIvpB5SKc2AgWP4mSiE9Jt-yDMIfVCHw7ohyx4ZE3xWIEiE-OypJy6FcJ8HX7gTfNI-6ZAWUxY7VYofFTM"/>
<!-- Overlay Gradient for text readability if needed later, but keeping it clean for now -->
<div class="absolute inset-0 bg-gradient-to-t from-background/80 via-transparent to-transparent md:hidden"></div>
</section>
<!-- Content Section -->
<section class="px-container-margin py-section-gap flex flex-col items-start gap-stack-lg flex-grow">
<div class="flex flex-col gap-stack-sm w-full">
<!-- Status Badge -->
<div class="flex items-center gap-2 mb-2">
<span class="inline-flex items-center justify-center bg-secondary-fixed-dim/20 text-on-secondary-container font-label-caps text-label-caps px-3 py-1 rounded-[2px] border border-secondary-fixed-dim/30 uppercase tracking-widest">
                        Qualifiée
                    </span>
<span class="text-surface-tint font-label-sm text-label-sm opacity-60">DEMAND_QUALIFIED</span>
</div>
<!-- Headline -->
<h2 class="font-display-lg text-display-lg md:font-headline-lg md:text-headline-lg text-primary tracking-tight">
                    Votre demande est prête
                </h2>
<!-- Body Text -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mt-4">
                    Vous avez décrit le résultat, le budget et la zone. Votre demande peut maintenant être proposée à des coiffeuses expertes disponibles.
                </p>
</div>
<!-- Recap Chips / Bento Data -->
<div class="flex flex-wrap gap-2 w-full mt-4">
<div class="bg-surface-container-low border border-surface-container rounded-[2px] px-4 py-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary-container">content_cut</span>
<span class="font-label-sm text-label-sm text-on-surface">Knotless medium</span>
</div>
<div class="bg-surface-container-low border border-surface-container rounded-[2px] px-4 py-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary-container">euro</span>
<span class="font-label-sm text-label-sm text-on-surface">Max 120 €</span>
</div>
<div class="bg-surface-container-low border border-surface-container rounded-[2px] px-4 py-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary-container">location_on</span>
<span class="font-label-sm text-label-sm text-on-surface">15 km</span>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-container p-container-margin flex flex-col gap-stack-md z-40">
<button class="w-full bg-primary-container text-on-primary rounded-lg py-4 font-headline-md text-headline-md-mobile flex items-center justify-center hover:opacity-90 transition-opacity active:scale-[0.98]">
            Lancer le matching
        </button>
<button class="w-full bg-transparent text-primary-container border border-primary-container rounded-lg py-4 font-headline-md text-headline-md-mobile flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-[0.98]">
            Voir ma demande
        </button>
</div>
</body></html>
