<!-- Script to handle custom radio dots if needed (CSS mostly handles it, but for completeness) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radios = document.querySelectorAll('input[type="radio"]');
            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all inner dots
                    document.querySelectorAll('.radio-inner div').forEach(dot => dot.classList.add('hidden'));
                    // Show current dot
                    if(e.target.checked) {
                        e.target.nextElementSibling.querySelector('.radio-inner div').classList.remove('hidden');
                    }
                });
            });
            
            // Service level toggle logic for visual demonstration
            const serviceRadios = document.querySelectorAll('input[name="service_level"]');
            const assisteTasks = document.getElementById('assiste-tasks');
            
            serviceRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if(e.target.value === 'assiste') {
                        assisteTasks.style.display = 'block';
                        // Re-apply selected styles to the cards
                        e.target.nextElementSibling.classList.add('border-2', 'border-primary', 'bg-surface-container-low', 'shadow-sm');
                        e.target.nextElementSibling.classList.remove('border', 'border-surface-container-highest');
                        
                        // Reset the other card
                        const completCard = document.querySelector('input[value="complet"]').nextElementSibling;
                        completCard.classList.remove('border-2', 'border-primary', 'bg-surface-container-low', 'shadow-sm');
                        completCard.classList.add('border', 'border-surface-container-highest');
                        
                    } else {
                        assisteTasks.style.display = 'none';
                        
                        // Apply selected styles to complet
                        e.target.nextElementSibling.classList.add('border-2', 'border-primary', 'bg-surface-container-low', 'shadow-sm');
                        e.target.nextElementSibling.classList.remove('border', 'border-surface-container-highest');
                        
                        // Reset the other card
                        const assisteCard = document.querySelector('input[value="assiste"]').nextElementSibling;
                        assisteCard.classList.remove('border-2', 'border-primary', 'bg-surface-container-low', 'shadow-sm');
                        assisteCard.classList.add('border', 'border-surface-container-highest');
                    }
                });
            });
            
            // Initialize the pre-selected radio dot visually
            const checkedRadios = document.querySelectorAll('input[type="radio"]:checked');
            checkedRadios.forEach(radio => {
                const inner = radio.nextElementSibling.querySelector('.radio-inner div');
                if(inner) inner.classList.remove('hidden');
            });
        });
    </script>
