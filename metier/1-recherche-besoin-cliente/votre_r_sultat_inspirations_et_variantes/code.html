<script>
        // Simple script to handle visual logic for the custom radio cards
        document.querySelectorAll('input[name="inspiration"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all
                document.querySelectorAll('input[name="inspiration"]').forEach(r => {
                    const container = r.closest('label').querySelector('.border-2, .border');
                    const img = r.closest('label').querySelector('img');
                    const checkBorder = r.closest('label').querySelector('.check-border');
                    const checkIcon = r.closest('label').querySelector('.check-icon');
                    
                    if(r !== this) {
                        container.className = 'border border-surface-container rounded-none transition-colors relative overflow-hidden bg-surface-container-lowest hover:border-outline-variant';
                        img.classList.add('grayscale-[20%]');
                        if(checkBorder) checkBorder.remove();
                        if(checkIcon) checkIcon.remove();
                    }
                });

                // Set active
                const activeContainer = this.closest('label').querySelector('.border');
                if(activeContainer) {
                    activeContainer.className = 'border-2 border-transparent rounded-none transition-colors relative overflow-hidden bg-surface-container-lowest';
                    const imgContainer = activeContainer.querySelector('.relative');
                    this.closest('label').querySelector('img').classList.remove('grayscale-[20%]');
                    
                    // Add check border
                    const borderDiv = document.createElement('div');
                    borderDiv.className = 'absolute inset-0 border-4 border-primary transition-opacity opacity-100 check-border pointer-events-none';
                    imgContainer.appendChild(borderDiv);

                    // Add check icon
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'absolute bottom-2 right-2 w-6 h-6 bg-primary text-on-primary rounded-full flex items-center justify-center opacity-100 check-icon transition-opacity';
                    iconDiv.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
                    imgContainer.appendChild(iconDiv);
                }
            });
        });
    </script>
</body></html>
