<style>
        .custom-radio:checked + div {
            border-color: #775a19;
            background-color: #fbf9f8;
        }
        .custom-radio:checked + div .radio-inner {
            background-color: #775a19;
        }
        .custom-radio:focus + div {
            box-shadow: 0 0 0 2px rgba(119, 90, 25, 0.2);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col relative pb-32">
<!-- TopAppBar (Transactional - No BottomNavBar) -->
<header class="sticky top-0 w-full bg-surface border-b border-surface-container flex justify-between items-center px-margin-mobile h-16 z-40">
<button class="text-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-150 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary font-bold">Cadre professionnel</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow px-margin-mobile pt-lg pb-3xl max-w-lg mx-auto w-full">
<!-- Header & Status -->
<div class="flex items-center justify-between mb-lg">
<span class="inline-flex items-center px-2 py-1 rounded bg-surface-container-low text-on-surface-variant font-label-mono text-label-mono border border-surface-container">
                BROUILLON
            </span>
<span class="font-label-mono text-label-mono text-on-surface-variant">2/4</span>
</div>
<!-- Stepper -->
<div class="flex items-center mb-xl">
<div class="flex-1 h-1 bg-surface-container-high rounded-l-full">
<div class="h-full bg-primary rounded-l-full w-full"></div>
</div>
<div class="w-2 h-2 rounded-full bg-primary mx-1"></div>
<div class="flex-1 h-1 bg-surface-container-high">
<div class="h-full bg-secondary rounded-r-full w-1/2"></div>
</div>
<div class="w-2 h-2 rounded-full bg-surface-container-high mx-1"></div>
<div class="flex-1 h-1 bg-surface-container-high"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-high mx-1"></div>
<div class="flex-1 h-1 bg-surface-container-high rounded-r-full"></div>
</div>
<!-- Content -->
<section class="space-y-xl">
<div>
<h2 class="font-headline-md text-headline-md-mobile text-primary mb-unit">Accueil &amp; accès</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ces règles s’appliquent par défaut à vos futures prestations.</p>
</div>
<!-- Choice Group 1: Accompagnants -->
<div class="space-y-sm">
<h3 class="font-button-text text-button-text text-primary">Accompagnants</h3>
<div class="space-y-unit">
<label class="relative flex items-center cursor-pointer group">
<input checked="" class="peer sr-only custom-radio" name="accompagnants" type="radio" value="none"/>
<div class="flex items-center w-full p-md bg-surface-container-lowest border border-surface-container rounded-lg transition-all">
<div class="w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center mr-md">
<div class="radio-inner w-3 h-3 rounded-full bg-transparent transition-colors"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Non acceptés</span>
</div>
</label>
<label class="relative flex items-center cursor-pointer group">
<input class="peer sr-only custom-radio" name="accompagnants" type="radio" value="one"/>
<div class="flex items-center w-full p-md bg-surface-container-lowest border border-surface-container rounded-lg transition-all">
<div class="w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center mr-md">
<div class="radio-inner w-3 h-3 rounded-full bg-transparent transition-colors"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Un accompagnant accepté</span>
</div>
</label>
<label class="relative flex items-center cursor-pointer group">
<input class="peer sr-only custom-radio" name="accompagnants" type="radio" value="conditions"/>
<div class="flex items-center w-full p-md bg-surface-container-lowest border border-surface-container rounded-lg transition-all">
<div class="w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center mr-md">
<div class="radio-inner w-3 h-3 rounded-full bg-transparent transition-colors"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Accompagnants acceptés selon modalités</span>
</div>
</label>
</div>
</div>
<!-- Choice Group 2: Mineurs -->
<div class="space-y-sm">
<h3 class="font-button-text text-button-text text-primary">Mineurs</h3>
<div class="space-y-unit">
<label class="relative flex items-center cursor-pointer group">
<input class="peer sr-only custom-radio" name="mineurs" type="radio" value="none"/>
<div class="flex items-center w-full p-md bg-surface-container-lowest border border-surface-container rounded-lg transition-all">
<div class="w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center mr-md">
<div class="radio-inner w-3 h-3 rounded-full bg-transparent transition-colors"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Non pris en charge</span>
</div>
</label>
<label class="relative flex items-center cursor-pointer group">
<input checked="" class="peer sr-only custom-radio" name="mineurs" type="radio" value="tutor"/>
<div class="flex items-center w-full p-md bg-surface-container-lowest border border-surface-container rounded-lg transition-all">
<div class="w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center mr-md">
<div class="radio-inner w-3 h-3 rounded-full bg-transparent transition-colors"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Acceptés avec tuteur présent</span>
</div>
</label>
<label class="relative flex items-center cursor-pointer group">
<input class="peer sr-only custom-radio" name="mineurs" type="radio" value="conditions"/>
<div class="flex items-center w-full p-md bg-surface-container-lowest border border-surface-container rounded-lg transition-all">
<div class="w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center mr-md">
<div class="radio-inner w-3 h-3 rounded-full bg-transparent transition-colors"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Acceptés selon conditions</span>
</div>
</label>
</div>
</div>
<!-- Optional Text Area -->
<div class="space-y-sm">
<label class="block font-button-text text-button-text text-primary" for="note-acces">Note d’accès (optionnel)</label>
<textarea class="w-full p-md bg-surface-container-lowest border border-surface-container rounded-lg font-body-md text-body-md text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none resize-none transition-all" id="note-acces" name="note-acces" placeholder="Ex. Sonner à l’interphone, retirer les chaussures…" rows="3"></textarea>
</div>
</section>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-container p-margin-mobile z-50 shadow-[0px_-4px_12px_rgba(27,28,28,0.04)]">
<div class="max-w-lg mx-auto">
<button class="w-full bg-primary-container text-on-primary h-12 rounded-lg font-button-text text-button-text flex items-center justify-center hover:bg-on-background transition-colors active:scale-95 duration-150">
                Continuer
            </button>
</div>
</div>
</body></html>
