<style>
        body { background-color: #FBF9F8; }
        .chip-checkbox:checked + label {
            background-color: #FDD587; /* secondary-container */
            color: #785A19; /* on-secondary-container */
            border-color: #FDD587;
        }
        .custom-radio:checked + label {
            border-color: #775a19;
            box-shadow: 0 0 0 2px rgba(119, 90, 25, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="text-on-surface font-body-md min-h-screen flex flex-col pb-24 md:pb-0">
<!-- Top App Bar -->
<header class="bg-surface fixed top-0 w-full z-50 border-b border-surface-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 transition-colors">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low active:scale-95 transition-transform duration-150 text-primary">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary flex-1 text-center">Cadre professionnel</h1>
<div class="flex items-center">
<span class="font-label-mono text-label-mono bg-surface-container text-on-surface-variant px-2 py-1 rounded">BROUILLON</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 mt-16 max-w-[1440px] mx-auto w-full grid grid-cols-4 md:grid-cols-8 lg:grid-cols-12 gap-gutter px-margin-mobile md:px-margin-desktop py-xl">
<!-- Left Column: Form -->
<div class="col-span-4 md:col-span-8 lg:col-span-6 xl:col-span-5 flex flex-col gap-2xl">
<!-- Stepper -->
<div class="flex items-center gap-2">
<div class="flex-1 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-full"></div>
</div>
<div class="flex-1 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-full"></div>
</div>
<div class="flex-1 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-secondary w-full"></div>
</div>
<div class="flex-1 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-transparent w-full"></div>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant ml-2">3/4</span>
</div>
<!-- Section 1: Communication -->
<section class="flex flex-col gap-lg bg-surface-container-lowest p-lg rounded-xl border border-surface-variant">
<div>
<h2 class="font-headline-md text-headline-md text-primary mb-2">Communication</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Quand les clientes peuvent vous écrire, et en combien de temps vous répondez.</p>
</div>
<div class="flex flex-col gap-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant font-semibold">Jours de disponibilité</label>
<div class="flex flex-wrap gap-2">
<div class="relative">
<input class="chip-checkbox peer sr-only" id="day-lun" type="checkbox"/>
<label class="cursor-pointer font-label-mono text-label-mono px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors inline-block" for="day-lun">Lun</label>
</div>
<div class="relative">
<input checked="" class="chip-checkbox peer sr-only" id="day-mar" type="checkbox"/>
<label class="cursor-pointer font-label-mono text-label-mono px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors inline-block" for="day-mar">Mar</label>
</div>
<div class="relative">
<input checked="" class="chip-checkbox peer sr-only" id="day-mer" type="checkbox"/>
<label class="cursor-pointer font-label-mono text-label-mono px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors inline-block" for="day-mer">Mer</label>
</div>
<div class="relative">
<input checked="" class="chip-checkbox peer sr-only" id="day-jeu" type="checkbox"/>
<label class="cursor-pointer font-label-mono text-label-mono px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors inline-block" for="day-jeu">Jeu</label>
</div>
<div class="relative">
<input checked="" class="chip-checkbox peer sr-only" id="day-ven" type="checkbox"/>
<label class="cursor-pointer font-label-mono text-label-mono px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors inline-block" for="day-ven">Ven</label>
</div>
<div class="relative">
<input checked="" class="chip-checkbox peer sr-only" id="day-sam" type="checkbox"/>
<label class="cursor-pointer font-label-mono text-label-mono px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors inline-block" for="day-sam">Sam</label>
</div>
<div class="relative">
<input class="chip-checkbox peer sr-only" id="day-dim" type="checkbox"/>
<label class="cursor-pointer font-label-mono text-label-mono px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors inline-block" for="day-dim">Dim</label>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant font-semibold">Délai de réponse indicatif</label>
<div class="flex flex-col gap-2">
<div class="relative">
<input class="custom-radio peer sr-only" id="delay-2h" name="delay" type="radio"/>
<label class="cursor-pointer flex items-center p-4 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-all" for="delay-2h">
<span class="font-body-md text-body-md">Sous 2 h</span>
<span class="material-symbols-outlined ml-auto text-secondary opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
</label>
</div>
<div class="relative">
<input checked="" class="custom-radio peer sr-only" id="delay-24h" name="delay" type="radio"/>
<label class="cursor-pointer flex items-center p-4 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-all" for="delay-24h">
<span class="font-body-md text-body-md">Sous 24 h</span>
<span class="material-symbols-outlined ml-auto text-secondary opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
</label>
</div>
<div class="relative">
<input class="custom-radio peer sr-only" id="delay-48h" name="delay" type="radio"/>
<label class="cursor-pointer flex items-center p-4 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low transition-all" for="delay-48h">
<span class="font-body-md text-body-md">Sous 48 h</span>
<span class="material-symbols-outlined ml-auto text-secondary opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
</label>
</div>
</div>
</div>
</section>
<!-- Section 2: Paiement -->
<section class="flex flex-col gap-lg bg-surface-container-lowest p-lg rounded-xl border border-surface-variant">
<div>
<h2 class="font-headline-md text-headline-md text-primary mb-2">Paiement</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Moyens que vous acceptez (information, pas de paiement ici).</p>
</div>
<div class="flex flex-col gap-2">
<label class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" type="checkbox"/>
<span class="font-body-md text-body-md">Espèces</span>
</label>
<label class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input checked="" class="w-5 h-5 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" type="checkbox"/>
<span class="font-body-md text-body-md">Carte bancaire</span>
</label>
<label class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" type="checkbox"/>
<span class="font-body-md text-body-md">Virement</span>
</label>
<label class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input checked="" class="w-5 h-5 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" type="checkbox"/>
<span class="font-body-md text-body-md">Paiement via la plateforme</span>
</label>
</div>
</section>
<!-- Spacer for sticky button on mobile -->
<div class="h-20 md:hidden"></div>
</div>
<!-- Right Column: Editorial Visual (Desktop Only) -->
<div class="hidden lg:block lg:col-span-6 xl:col-span-7 h-full">
<div class="sticky top-24 h-[calc(100vh-8rem)] rounded-xl overflow-hidden shadow-sm">
<img class="w-full h-full object-cover" data-alt="A professional Black female hair stylist with beautiful textured Afro hair, wearing a sleek modern apron or minimalist chic outfit, checking her smartphone or digital schedule. The setting is a bright, premium hair atelier with clean lines, soft natural lighting, and a calm, authoritative atmosphere. High-end editorial photography style, muted tones with soft warm highlights." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-SbUGqT_VnO7hlRjbur0BUr7z6GEcoZTZVM_57BMRFByFmaUaJdwlcyODNFuEvDB37YXNN38WoSxqiHv8t_fjfMPmMZG_yw8PIZhiIfs4dI5L-8j3pnqeqJcz-DlfLvEp9i4w-SY82vqwPnfdrTu5SmFgNuozQi2aHrd7OPTGXFqvUGqQ9LDz6-R32ujTnpRTQjaxWEFEi_-AMzu3YgTVLY-sjqLrrpdGgNfXUKFc_qBNXLn2HZoiMw"/>
</div>
</div>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-sm border-t border-surface-variant p-4 md:p-6 z-40 lg:hidden">
<div class="max-w-[1440px] mx-auto flex justify-end px-0 md:px-margin-desktop">
<button class="w-full md:w-auto bg-primary text-on-primary font-button-text text-button-text py-3 px-8 rounded-lg hover:bg-inverse-surface transition-colors active:scale-95 duration-150 shadow-sm min-h-[44px]">
                Continuer
            </button>
</div>
</div>
<!-- Desktop CTA (Inline) -->
<div class="hidden lg:flex max-w-[1440px] mx-auto w-full px-margin-desktop py-lg justify-end col-span-12">
<button class="bg-primary text-on-primary font-button-text text-button-text py-3 px-8 rounded-lg hover:bg-inverse-surface transition-colors active:scale-95 duration-150 shadow-sm min-h-[44px]">
            Continuer
        </button>
</div>
<script>
        // Simple script to handle custom radio styling logic
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('label[for^="delay-"]').forEach(label => {
                    if(label.htmlFor === this.id) {
                        label.style.borderColor = '#775a19';
                        label.style.boxShadow = '0 0 0 2px rgba(119, 90, 25, 0.2)';
                    } else {
                        label.style.borderColor = '#c4c7c7';
                        label.style.boxShadow = 'none';
                    }
                });
            });
        });
    </script>
</body></html>
