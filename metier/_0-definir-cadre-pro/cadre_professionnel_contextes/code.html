<script>
        // Simple script to toggle button state based on checkboxes
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const submitBtn = document.querySelector('button[disabled]');

            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const anyChecked = Array.from(checkboxes).some(c => c.checked);
                    if (anyChecked) {
                        submitBtn.removeAttribute('disabled');
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'hover:opacity-60');
                        submitBtn.classList.add('hover:bg-tertiary', 'shadow-sm');
                    } else {
                        submitBtn.setAttribute('disabled', 'true');
                        submitBtn.classList.add('opacity-50', 'cursor-not-allowed', 'hover:opacity-60');
                        submitBtn.classList.remove('hover:bg-tertiary', 'shadow-sm');
                    }
                });
            });
        });
    </script>
